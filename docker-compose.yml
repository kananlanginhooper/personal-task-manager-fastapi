# Same file on the laptop and on the server. All settings come from .env (see .env.example).
# No database service here: the API connects to the shared MySQL server at DB_HOST.
# The image also serves the UI, built from the sibling clone ../personal-task-manager-angular.
services:
  api:
    build:
      context: .
      additional_contexts:
        ui-src: ../personal-task-manager-angular
    image: personal-task-manager-api
    env_file: .env
    ports:
      # IPv4 only, on one address: the LAN address on a server, 127.0.0.1 on a laptop. Never 0.0.0.0 or [::].
      - "${BIND_ADDR:-127.0.0.1}:${API_PORT:-8095}:${API_PORT:-8095}"
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c", "import os, urllib.request; urllib.request.urlopen(f'http://127.0.0.1:{os.environ.get(\"API_PORT\", \"8095\")}/api/health', timeout=3)"]
      interval: 30s
      timeout: 5s
      retries: 3

# The shared network every home-project container joins. Create it once per machine with
# `docker network create --subnet <shared subnet> homelab` (the subnet is in the home dev standard).
networks:
  default:
    name: homelab
    external: true
